<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield background -->
  <path d="M256 40 L456 120 L456 240 C456 380 256 472 256 472 C256 472 56 380 56 240 L56 120 Z" fill="url(#bg)" filter="url(#shadow)" stroke="#ffffff" stroke-width="8"/>

  <!-- FOCAL text -->
  <text x="256" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">FOCAL</text>

  <!-- Tagline -->
  <text x="256" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.9">Trust Before You Apply</text>

  <!-- Verified checkmark -->
  <circle cx="256" cy="320" r="70" fill="#ffffff"/>
  <path d="M220 320 L244 344 L292 296" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom label -->
  <rect x="116" y="380" width="280" height="56" rx="28" fill="#ffffff" opacity="0.95"/>
  <text x="256" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#059669">VERIFIED COMPANY</text>
</svg>
